    if (ev.target.classList && ev.target.classList.contains('timeIn')) { var fv = E.finishTimeInput(ev.target.value); if (fv !== ev.target.value) { ev.target.value = fv; if (ev.target.id === 'dayStart' || ev.target.id === 'dayEnd') updateEnd(false); } if (/^ot(Start|End|TravAmt)$/.test(ev.target.id)) otPreview(); }

    if (ev.target.id === 'heEff' || ev.target.id === 'heRank') { histDiffLine(); if (ev.target.id === 'heRank') heInvSync(); }
    if (ev.target.id === 'otDate') { otPreview(); otTravResolve(); }
    if (/^(ot|he|onb)Cmd(UAddr|Addr)$/.test(ev.target.id)) cmdChanged(ev.target.id.replace(/Cmd(UAddr|Addr)$/, ''));
    if (ev.target.id === 'pdDur') { var dm = E.parseHM(ev.target.value); if (dm) ev.target.value = E.fmtHM(E.roundPaidMin(dm)); pdRemind(); } // :59 rounds up
    if (ev.target.id === 'pdTaxYear') pdTaxSheet(ev.target.value);
    if (ev.target.id === 'pdAmount') { pdAmtHint(); var form = document.getElementById('pdForm'); if (form) pdPayFrom(readPaid(), form.dataset.iso); }
    if (ev.target.id === 'pdDate') pdDateCheck();
    if (ev.target.id === 'pdFile' && ev.target.files && ev.target.files[0]) { var pf = ev.target.files[0]; ev.target.value = ''; pdScan(pf); } // file stays in memory only
    if (ev.target.dataset && ev.target.dataset.pf === 'rank') { var w = document.getElementById(ev.target.id + 'OtherWrap'); if (w) w.hidden = ev.target.value !== 'other'; }
    if (/SteadyOther$/.test(ev.target.id) && ev.target.value) { var px = ev.target.dataset.px, fake = document.createElement('button'); fake.dataset.px = px; fake.dataset.key = ev.target.value; A.chartPick(fake); }
    if (ev.target.dataset && ev.target.dataset.sync) { var inc = Object.assign({}, (S.sync || {}).include || {}); inc[ev.target.dataset.sync] = ev.target.checked; S.sync = Object.assign({}, S.sync || {}, { include: inc }); save(true); refreshSync(); }
    if ((ev.target.id === 'syncFrom' || ev.target.id === 'syncTo') && ev.target.value) { var o = {}; o[ev.target.id === 'syncFrom' ? 'from' : 'to'] = ev.target.value; S.sync = Object.assign({}, S.sync || {}, o); save(true); refreshSync(); }
    if (ev.target.id === 'stMapsInBk') { S.settings.mapsKeyInBackup = ev.target.checked; save(true); var bt = document.getElementById('bkText'); if (bt) bt.value = backupText(); }
    if (ev.target.id === 'x15Na') { var xd = document.getElementById('x15Dates'); if (xd) xd.hidden = ev.target.checked; }
    if (ev.target.id === 'lkDate' && ev.target.value) { ui.lookup = E.toDay(ev.target.value); render(); }
    if (ev.target.classList && ev.target.classList.contains('slipfile') && ev.target.files && ev.target.files[0]) { var sfile = ev.target.files[0]; ev.target.value = ''; var ch = document.getElementById('slipChoose'); if (ch) ch.hidden = true; slipStart(sfile); }
    if (ev.target.id === 'sfEnh' && slipF) { slipF.enhance = ev.target.checked; slipPreview(); }
    if (ev.target.id === 'importFile' && ev.target.files[0]) { var r = new FileReader(); r.onload = function () { importData(r.result); }; r.readAsText(ev.target.files[0]); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    var box = document.getElementById('lvOpts');
    if (box && box.classList.contains('open')) { closeDaySel(); ev.preventDefault(); return; }
    if (document.getElementById('cfmDlg')) return; // the confirm box handles its own Escape
    if (document.getElementById('slipFlow')) slipClose(); else if (sheetRoot.firstElementChild) navBack();
  });
  // Refresh "today" if the app is left open past midnight.
  document.addEventListener('visibilitychange', function () { if (!document.hidden && E.today() !== T) { T = E.today(); tp = E.parts(T); render(); } });

  // Sheets that can be returned to (see navable / openSheet)
  daySheet = navable('day', daySheet); daySummary = navable('sum', daySummary);
  pdSheet = navable('pd', pdSheet, function (iso) { return iso || ''; });
  pdTaxSheet = navable('pdTax', pdTaxSheet, function (year) { return String(year || ''); });
  otSheet = navable('ot', otSheet, function (e, d) { return e ? e.id : 'new:' + (d || ''); });
  settingsSheet = navable('settings', settingsSheet, function () { return ''; });
  histEditor = navable('hist', histEditor, function (r) { return r ? r.id : 'new'; });
  chartEditor = navable('chart', chartEditor, function (e) { return e ? e.id : 'new'; });
  suggestSheet = navable('suggest', suggestSheet, function () { return ''; });
  inboxSheet = navable('inbox', inboxSheet, function () { return ''; }); adminSheet = navable('admin', adminSheet, function () { return ''; });
  x15Sheet = navable('x15', x15Sheet); x15Editor = navable('x15ed', x15Editor, function (y, m, t) { return [y, m, t].join('-'); });
  A.leaveNew = navable('leaveNew', A.leaveNew, function (t) { return t && t.dataset ? t.dataset.kind || '' : ''; }); A.syncOpen = navable('sync', A.syncOpen, function () { return ''; });
  if (CL.enabled) cloudBoot(); else { render(); slipReconcile(); }
  setTimeout(function () { try { if (S.profile) resolveHistPcts(); } catch (e) {} }, 1500);
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]') && /^(https:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href)) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    navigator.serviceWorker.addEventListener('message', function (ev) { if (ev.data && ev.data.type === 'open-inbox' && CS && CS.role === 'admin') inboxSheet(); });
  }
})();
